name: Create Release

# Controls when the workflow will run
on:
  # Triggers the workflow on push to the "main" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow the built-in GITHUB_TOKEN to create tags and releases
permissions:
  contents: write

jobs:
  build:
    if: contains(github.event.head_commit.message, 'release')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Version Name
        id: extract_version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_NAME }}
          name: Release v${{ env.VERSION_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Drives which in-app update flow the app shows (see AppUpdates.kt):
      # priority 5 makes it a blocking, immediate update, for a build that
      # fixes something bad enough to be worth interrupting people over.
      # The message goes through the environment, never straight into the
      # shell, so it can't be used to inject commands.
      - name: Decide in-app update priority
        id: priority
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" == *hotfix* ]]; then
            echo "value=5" >> "$GITHUB_OUTPUT"
            echo "hotfix detected: in-app update priority 5 (immediate)"
          else
            echo "value=0" >> "$GITHUB_OUTPUT"
            echo "in-app update priority 0 (flexible)"
          fi

      - name: Upload Android Release to Play Store
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.techrush_app.goldrate
          releaseFiles: app/release/app-release.aab
          track: production
          whatsNewDirectory: app/src/main/play
          # Full rollout: every user gets the release at once. There is no
          # staged halt valve, so a bad build has to be rolled back from the
          # Play Console. Switch back to `status: inProgress` plus a
          # `userFraction` for a staged release.
          status: completed
          inAppUpdatePriority: ${{ steps.priority.outputs.value }}
