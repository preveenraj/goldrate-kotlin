name: Create Release

# Controls when the workflow will run
on:
  # Triggers the workflow on push to the "main" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow the built-in GITHUB_TOKEN to create tags and releases
permissions:
  contents: write

jobs:
  build:
    if: contains(github.event.head_commit.message, 'release')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Version Name
        id: extract_version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_NAME }}
          name: Release v${{ env.VERSION_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Android Release to Play Store
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.techrush_app.goldrate
          releaseFiles: app/release/app-release.aab
          track: production
          whatsNewDirectory: app/src/main/play
          # Staged rollout: ships to 20% of users and stays halt-able from the
          # Play Console. Promote to 100% there (or set status: completed here)
          # once the release looks clean on real devices.
          status: inProgress
          userFraction: 0.2
